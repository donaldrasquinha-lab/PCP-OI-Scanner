<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCP & OI Scanner — Nifty 50 + Index OI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#060a10;--bg-1:#0b1018;--bg-2:#111825;--bg-3:#182035;--border:rgba(255,255,255,.06);--bh:rgba(255,255,255,.12);--t0:#e8ecf2;--t1:#b0bac8;--t2:#6b7a8d;--t3:#3d4d60;--grn:#00e676;--grn-bg:rgba(0,230,118,.08);--grn-bd:rgba(0,230,118,.25);--red:#ff1744;--red-bg:rgba(255,23,68,.08);--red-bd:rgba(255,23,68,.25);--yel:#ffd600;--yel-bg:rgba(255,214,0,.06);--yel-bd:rgba(255,214,0,.2);--blu:#448aff;--blu-bg:rgba(68,138,255,.1);--blu-bd:rgba(68,138,255,.3);--pur:#d500f9;--mono:'DM Mono','Fira Code',monospace;--disp:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-0);color:var(--t1);font-family:var(--disp);min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg-1)}::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:3px}
input,select,button{font-family:inherit}
code{font-family:var(--mono);font-size:.85em;background:var(--bg-3);padding:1px 5px;border-radius:3px;color:var(--t0)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.card{background:var(--bg-1);border:1px solid var(--border);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.tabs{display:flex;gap:2px;background:var(--bg-2);border-radius:8px;padding:3px}
.tab-btn{padding:7px 16px;border:none;background:transparent;color:var(--t2);font-size:12px;font-family:var(--mono);cursor:pointer;border-radius:6px;transition:all .2s;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.tab-btn.active{background:var(--bg-1);color:var(--blu);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pill{padding:4px 11px;border:1px solid transparent;background:transparent;color:var(--t2);font-size:10px;font-family:var(--mono);cursor:pointer;border-radius:20px;transition:all .15s;text-transform:uppercase;font-weight:500}
.pill.active{border-color:var(--blu-bd);background:var(--blu-bg);color:var(--blu)}
.pill[data-s="BULLISH"].active{border-color:var(--grn-bd);background:var(--grn-bg);color:var(--grn)}
.pill[data-s="BEARISH"].active{border-color:var(--red-bd);background:var(--red-bg);color:var(--red)}
.pill[data-s="ARBITRAGE"].active{border-color:var(--yel-bd);background:var(--yel-bg);color:var(--yel)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;font-family:var(--mono)}
th{padding:9px 10px;text-align:right;color:var(--t3);font-size:10px;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;font-weight:500}
th:first-child{text-align:left}th.sorted{color:var(--blu)}
td{padding:8px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,.02)}td:first-child{text-align:left}
tbody tr{cursor:pointer;transition:background .1s}tbody tr:hover{background:rgba(255,255,255,.025)!important}
.sig{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10px;font-weight:600}
.sig-BULLISH{background:var(--grn-bg);border:1px solid var(--grn-bd);color:var(--grn)}
.sig-BEARISH{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red)}
.sig-ARBITRAGE{background:var(--yel-bg);border:1px solid var(--yel-bd);color:var(--yel)}
.sig-NEUTRAL{background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--t2)}
.vbar{display:flex;align-items:center;gap:5px}.vtrack{width:55px;height:5px;background:var(--bg-2);border-radius:3px;overflow:hidden}.vfill{height:100%;border-radius:3px;transition:width .3s}
.btn-sm{background:var(--bg-2);border:1px solid var(--bh);color:var(--t2);padding:5px 13px;border-radius:6px;cursor:pointer;font-size:11px;font-family:var(--mono);transition:all .15s}
.btn-sm:hover{border-color:var(--blu-bd);color:var(--blu)}.btn-sm.on{background:var(--blu-bg);border-color:var(--blu-bd);color:var(--blu)}
.heat-cell{border-radius:8px;padding:10px 8px;cursor:pointer;text-align:center;transition:transform .12s;border:1px solid transparent}.heat-cell:hover{transform:scale(1.06)}
.pbar{width:200px;height:3px;background:var(--bg-2);border-radius:3px;overflow:hidden;margin:10px auto}.pfill{height:100%;background:linear-gradient(90deg,var(--grn),var(--blu));border-radius:3px;transition:width .3s}
select{background:var(--bg-2);border:1px solid var(--bh);color:var(--t0);padding:5px 10px;border-radius:6px;font-size:12px;font-family:var(--mono);outline:none}select option{background:var(--bg-0)}
</style>
</head>
<body>
<div id="app" style="max-width:1400px;margin:0 auto">
  <header id="hdr" style="background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"></header>
  <div id="main" style="padding:16px 20px"></div>
</div>
<script>
// ═══ STATE ═══════════════════════════════════════════════════════
const S={token:'',live:false,conf:true,data:[],noi:null,sel:null,tab:'scanner',flt:'ALL',q:'',sk:'maxPCPPct',sd:-1,
  upd:null,ld:false,ar:false,vt:0.3,exp:'',exps:[],errs:[],prg:{d:0,t:0},syms:[]};
const N50={"RELIANCE":1,"TCS":1,"HDFCBANK":1,"INFY":1,"ICICIBANK":1,"HINDUNILVR":1,"ITC":1,"SBIN":1,"BHARTIARTL":1,"KOTAKBANK":1,"LT":1,"AXISBANK":1,"BAJFINANCE":1,"ASIANPAINT":1,"MARUTI":1,"TITAN":1,"SUNPHARMA":1,"ULTRACEMCO":1,"WIPRO":1,"NESTLEIND":1,"HCLTECH":1,"TATAMOTORS":1,"NTPC":1,"POWERGRID":1,"M&M":1,"TATASTEEL":1,"ONGC":1,"JSWSTEEL":1,"ADANIPORTS":1,"COALINDIA":1,"BAJAJFINSV":1,"GRASIM":1,"TECHM":1,"DRREDDY":1,"HINDALCO":1,"CIPLA":1,"BPCL":1,"DIVISLAB":1,"APOLLOHOSP":1,"EICHERMOT":1,"TATACONSUM":1,"SBILIFE":1,"BRITANNIA":1,"INDUSINDBK":1,"HEROMOTOCO":1,"HDFCLIFE":1,"BAJAJ-AUTO":1,"UPL":1,"LTIM":1,"SHRIRAMFIN":1};
const ALL_SYMS=Object.keys(N50);
S.syms=ALL_SYMS.slice(0,10);
let arTimer=null;

// ═══ EXPIRY HELPERS ══════════════════════════════════════════════
function nextThursdays(n=6){const r=[];const d=new Date();d.setHours(0,0,0,0);while(d.getDay()!==4)d.setDate(d.getDate()+1);
const now=new Date(),ih=(now.getUTCHours()+5)+(now.getUTCMinutes()+30)/60;if(now.getDay()===4&&ih>15.5)d.setDate(d.getDate()+7);
for(let i=0;i<n;i++){r.push(fmtD(d));d.setDate(d.getDate()+7)}return r}
function monthlyExpiries(n=3){const r=[],now=new Date();let m=now.getMonth(),y=now.getFullYear();for(let i=0;i<n;i++){
const ld=new Date(y,m+1,0);while(ld.getDay()!==4)ld.setDate(ld.getDate()-1);if(ld>now||i>0)r.push(fmtD(ld));m++;if(m>11){m=0;y++}}return r}
function autoExpiries(){return[...new Set([...nextThursdays(6),...monthlyExpiries(3)])].sort()}
function fmtD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dte(e){return Math.max(0,Math.ceil((new Date(e+'T15:30:00+05:30')-new Date())/864e5))}
S.exps=autoExpiries();S.exp=S.exps[0]||'';

// ═══ API CALLS (local Flask backend — v2 snapshot model) ════════
const BASE=location.origin;
async function api(path,opts={}){
  const r=await fetch(BASE+path,{headers:opts.token?{'Authorization':'Bearer '+opts.token,'Content-Type':'application/json'}:{'Content-Type':'application/json'},...opts});
  return r.json();
}
async function apiPost(path,body){
  return fetch(BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
}

async function fetchExpiries(){
  try{const r=await api('/api/expiries',{token:S.token});if(r.status==='success'){S.exps=r.expiries;if(!S.exps.includes(S.exp))S.exp=S.exps[0]||''}}
  catch(e){S.errs.push('Expiry: '+e.message)}
}

// Start background engine on server
async function startEngine(){
  try{await apiPost('/api/start',{token:S.token,expiry:S.exp,symbols:S.syms})}
  catch(e){S.errs.push('Engine start: '+e.message)}
}
async function stopEngine(){
  try{await apiPost('/api/stop',{})}catch(e){}
}

// Poll snapshot — this is FREE (no Upstox calls, just reads server memory)
let pollTimer=null;
function startPolling(){
  stopPolling();
  pollTimer=setInterval(async()=>{
    try{
      const r=await api('/api/snapshot');
      if(r.status==='success'){
        if(r.stocks?.length)S.data=r.stocks;
        if(r.niftyOI)S.noi=r.niftyOI;
        S.errs=r.errors||[];
        if(r.lastSweep)S.upd=new Date(r.lastSweep);
        S.engineStats={rateLimit:r.rateLimit,cache:r.cache,backoffs:r.backoffs,progress:r.progress};
        S.ld=(r.progress?.phase||'')!=='done'&&(r.progress?.phase||'')!=='idle';
        render();
      }
    }catch(e){}
  }, 3000); // poll every 3s — free, reads server memory
}
function stopPolling(){clearInterval(pollTimer);pollTimer=null}

// ═══ SIMULATION ═════════════════════════════════════════════════
function pcp(c,p,s,k,d,r=.065){const T=Math.max(d,1)/365;const v=(c-p)-(s-k*Math.exp(-r*T));return{v:v,p:s?v/s*100:0}}
function simStock(sym){const h=[...sym].reduce((a,c)=>a+c.charCodeAt(0),0);const sp=500+(h%4500)+(Math.random()-.5)*50;const atm=Math.round(sp/50)*50;
const dt=7+~~(Math.random()*20),iv=15+Math.random()*35;const ch=[];for(let i=-5;i<=5;i++){const K=atm+i*50;
const cP=Math.max(.05,Math.max(sp-K,0)+sp*.02*(1+Math.random()*.5)),pP=Math.max(.05,Math.max(K-sp,0)+sp*.02*(1+Math.random()*.5));
const p0=pcp(cP,pP,sp,K,dt),cO=~~(Math.random()*5e4+5e3),pO=~~(Math.random()*5e4+5e3);
ch.push({strike:K,spot:sp,callLTP:cP,putLTP:pP,callOI:cO,putOI:pO,callOIChg:~~((Math.random()-.45)*15e3),putOIChg:~~((Math.random()-.45)*15e3),
callVol:~~(Math.random()*2e4+1e3),putVol:~~(Math.random()*2e4+1e3),pcpViolation:p0.v,pcpPct:p0.p,callIV:iv+(Math.random()-.5)*10,putIV:iv+(Math.random()-.5)*10,pcr:pO/(cO||1)})}
const tC=ch.reduce((s,c)=>s+c.callOI,0),tP=ch.reduce((s,c)=>s+c.putOI,0),tCC=ch.reduce((s,c)=>s+c.callOIChg,0),tPC=ch.reduce((s,c)=>s+c.putOIChg,0);
const mx=ch.reduce((m,c)=>Math.abs(c.pcpPct)>Math.abs(m.pcpPct)?c:m,ch[0]),pcr=tP/(tC||1);
let sig='NEUTRAL';if(pcr>1.3&&tPC>5e3)sig='BULLISH';else if(pcr<.7&&tCC>5e3)sig='BEARISH';else if(Math.abs(mx.pcpPct)>.5)sig='ARBITRAGE';
return{symbol:sym,spot:sp,atmStrike:atm,iv,pcr,totalCallOI:tC,totalPutOI:tP,totalCallOIChg:tCC,totalPutOIChg:tPC,maxPCPViolation:mx.pcpViolation,maxPCPPct:mx.pcpPct,violationStrike:mx.strike,signal:sig,chain:ch,expiry:'sim'}}
function simNiftyOI(){const sp=24200+(Math.random()-.5)*400,atm=Math.round(sp/50)*50,ch=[];
for(let i=-15;i<=15;i++){const K=atm+i*50,d=Math.abs(i),cO=~~((Math.random()*8e4+2e4)*(1+d*.1)),pO=~~((Math.random()*8e4+2e4)*(1+d*.08));
ch.push({strike:K,callOI:cO,putOI:pO,callOIChg:~~((Math.random()-.45)*2e4),putOIChg:~~((Math.random()-.45)*2e4),
callVol:~~(Math.random()*1e5+1e4),putVol:~~(Math.random()*1e5+1e4),callLTP:Math.max(.05,Math.max(sp-K,0)+100*Math.random()),
putLTP:Math.max(.05,Math.max(K-sp,0)+100*Math.random()),callIV:12+Math.random()*20,putIV:12+Math.random()*20,pcr:pO/(cO||1)})}
const tC=ch.reduce((s,c)=>s+c.callOI,0),tP=ch.reduce((s,c)=>s+c.putOI,0);
return{spot:sp,chain:ch,totalCallOI:tC,totalPutOI:tP,pcr:+(tP/(tC||1)).toFixed(4),
maxCallOIStrike:ch.reduce((m,c)=>c.callOI>m.callOI?c:m,ch[0]),maxPutOIStrike:ch.reduce((m,c)=>c.putOI>m.putOI?c:m,ch[0]),expiry:S.exp}}

// ═══ REFRESH ════════════════════════════════════════════════════
async function refresh(){
  S.ld=true;S.errs=[];render();
  if(!S.live){S.data=ALL_SYMS.map(simStock);S.noi=simNiftyOI();S.upd=new Date();S.ld=false;render();return}
  // In live mode, just trigger a snapshot poll — engine runs in background on server
  try{
    const r=await api('/api/snapshot');
    if(r.status==='success'){
      if(r.stocks?.length)S.data=r.stocks;
      if(r.niftyOI)S.noi=r.niftyOI;
      S.errs=r.errors||[];
      if(r.lastSweep)S.upd=new Date(r.lastSweep);
      S.engineStats={rateLimit:r.rateLimit,cache:r.cache,backoffs:r.backoffs,progress:r.progress};
    }
  }catch(e){S.errs.push('Snapshot: '+e.message)}
  S.ld=false;render();
}

// ═══ FORMAT ═════════════════════════════════════════════════════
const f=(n,d=2)=>n!=null&&!isNaN(n)?Number(n).toFixed(d):'—';
const fK=n=>{if(n==null||isNaN(n))return'—';if(n>=1e7)return(n/1e7).toFixed(2)+'Cr';if(n>=1e5)return(n/1e5).toFixed(2)+'L';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n+''};
const fI=n=>n!=null?'₹'+f(n):'—';
const e=s=>(s+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sc=s=>s==='BULLISH'?'var(--grn)':s==='BEARISH'?'var(--red)':s==='ARBITRAGE'?'var(--yel)':'var(--t3)';
function vb(p){const w=Math.min(Math.abs(p)*100,100),c=p>0?'var(--grn)':'var(--red)';
return`<div class="vbar"><div class="vtrack"><div class="vfill" style="width:${w}%;background:${c}"></div></div><span style="color:${c};font-size:11px;font-family:var(--mono);min-width:48px">${p>0?'+':''}${f(p,3)}%</span></div>`}

// ═══ RENDER ═════════════════════════════════════════════════════
function render(){renderHdr();renderMain()}

function renderHdr(){
  let h=`<div style="display:flex;align-items:center;gap:12px">
    <div style="width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--bg-0);
      background:${S.live?'linear-gradient(135deg,var(--grn),var(--blu))':'linear-gradient(135deg,#546e7a,#37474f)'}">Σ</div>
    <div><div style="font-size:17px;font-weight:700;color:var(--t0);letter-spacing:-.03em">PCP & OI Scanner
      <span style="margin-left:8px;font-size:10px;padding:2px 8px;border-radius:10px;font-family:var(--mono);font-weight:600;vertical-align:middle;
        ${S.live?'background:var(--grn-bg);border:1px solid var(--grn-bd);color:var(--grn)':'background:rgba(255,145,0,.12);border:1px solid rgba(255,145,0,.3);color:#ff9100'}">${S.live?'LIVE':'SIM'}</span></div>
      <div style="font-size:11px;color:var(--t3);margin-top:1px">${S.live?`Upstox v2+v3 · ${S.exp} (${dte(S.exp)}d) · ${S.data.length} stocks`:'Nifty 50 + Index OI · Connect to go live'}</div></div></div>`;
  h+=`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">`;
  if(S.upd)h+=`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)"><div style="width:7px;height:7px;border-radius:50%;background:${S.live?'var(--grn)':'#ff9100'};${S.ar?'animation:pulse 2s infinite':''}"></div>${S.upd.toLocaleTimeString('en-IN')}</div>`;
  h+=`<button class="btn-sm" onclick="S.conf=!S.conf;render()">⚙ CONFIG</button>`;
  h+=`<button class="btn-sm ${S.ar?'on':''}" onclick="S.ar=!S.ar;clearInterval(arTimer);if(S.ar)arTimer=setInterval(refresh,30000);render()">${S.ar?'AUTO 30s':'MANUAL'}</button>`;
  h+=`<button class="btn-sm" onclick="refresh()" ${S.ld?'disabled':''}>${S.ld?'⏳':'↻'} REFRESH</button></div>`;
  document.getElementById('hdr').innerHTML=h;
}

function renderMain(){
  let h='';
  if(S.conf)h+=renderConf();
  if(S.errs.length){h+=`<div style="padding:10px 14px;background:var(--red-bg);border:1px solid var(--red-bd);border-radius:8px;margin-bottom:12px">
    <div style="font-size:11px;color:var(--red);font-weight:600;margin-bottom:4px">${S.errs.length} error(s):</div>`;
    S.errs.slice(0,5).forEach(x=>{h+=`<div style="font-size:10px;color:#b0616a;font-family:var(--mono);line-height:1.5">• ${e(x)}</div>`});
    if(S.errs.length>5)h+=`<div style="font-size:10px;color:var(--t2);margin-top:4px">...${S.errs.length-5} more</div>`;h+=`</div>`}
  h+=renderStats()+renderControls();
  if(S.ld&&!S.data.length)h+=`<div style="text-align:center;padding:60px"><div style="font-size:14px;color:var(--t2)">${S.live?'Fetching live data...':'Loading...'}</div><div class="pbar"><div class="pfill" style="width:40%"></div></div></div>`;
  else if(S.tab==='chain'&&S.sel)h+=renderChain(S.sel);
  else if(S.tab==='heatmap')h+=renderHeatmap();
  else if(S.tab==='niftyoi')h+=renderNOI();
  else h+=renderScanner();
  h+=renderFooter();
  document.getElementById('main').innerHTML=h;
}

// ═══ CONFIG ═════════════════════════════════════════════════════
function renderConf(){
  let h=`<div class="card" style="margin-bottom:14px;animation:fadeUp .25s">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
      <div><h3 style="color:var(--t0);font-size:15px;font-weight:600">${S.live?'⚡ Connected':'🔌 Connect to Upstox API'}</h3>
      <p style="color:var(--t2);font-size:12px;margin-top:5px;line-height:1.5;max-width:580px">${S.live?'Live mode. Change expiry or disconnect below.'
      :'Runs via local Python backend (server.py) which proxies Upstox API calls — no CORS issues. Start the server first, then paste your token.'}</p></div>
      ${!S.live?`<button class="btn-sm" onclick="S.conf=false;render()">✕</button>`:''}</div>`;
  if(!S.live){
    h+=`<div style="display:flex;gap:8px;margin-bottom:12px">
      <input type="password" id="tkn" placeholder="Paste Upstox access_token..." value="${e(S.token)}"
        style="flex:1;background:var(--bg-2);border:1px solid var(--bh);color:var(--t0);padding:10px 14px;border-radius:8px;font-size:13px;font-family:var(--mono);outline:none">
      <button onclick="goLive()" style="background:linear-gradient(135deg,var(--grn),var(--blu));border:none;color:var(--bg-0);padding:10px 24px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700">GO LIVE ⚡</button></div>`;
    // Symbols
    h+=`<div style="margin-top:10px"><div style="font-size:10px;color:var(--t2);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;font-family:var(--mono)">Symbols (${S.syms.length}/${ALL_SYMS.length})</div>
      <div style="display:flex;flex-wrap:wrap;gap:3px">`;
    ALL_SYMS.forEach(sym=>{const on=S.syms.includes(sym);h+=`<button class="pill ${on?'active':''}" onclick="tSym('${sym}')" style="font-size:9px;padding:3px 7px">${sym}</button>`});
    h+=`</div><div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn-sm" onclick="S.syms=[...ALL_SYMS];render()">All 50</button>
      <button class="btn-sm" onclick="S.syms=ALL_SYMS.slice(0,10);render()">Top 10</button>
      <button class="btn-sm" onclick="S.syms=[];render()">Clear</button></div></div>`;
    // Expiry
    h+=`<div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:11px;color:var(--t2)">Expiry:</span><select onchange="S.exp=this.value;render()">`;
    S.exps.forEach(x=>{h+=`<option value="${x}" ${x===S.exp?'selected':''}>${x} (${dte(x)}d)</option>`});
    h+=`</select><span style="font-size:10px;color:var(--t3);font-family:var(--mono)">Auto-computed Thursdays from today</span></div>`;
    h+=`<div style="margin-top:12px;padding:10px 14px;background:var(--yel-bg);border:1px solid var(--yel-bd);border-radius:8px;font-size:11px;color:#b0a040;line-height:1.6">
      <strong>Setup:</strong> <code>pip install flask requests</code> then <code>python server.py</code> (port 5050).<br>
      <strong>v2 Engine:</strong> Token-bucket rate limiter (50/min) · Staggered scan (5 symbols/2s = full N50 in ~20s) ·
      Exp backoff (5→10→30→60s) · Batch LTP via <code>/v3/market-quote/ltp</code> (50 keys/call) ·
      Frontend polls <code>/api/snapshot</code> every 3s (zero API cost — reads server memory)</div>`;
  } else {
    h+=`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">

      <button class="btn-sm" style="border-color:var(--red-bd);color:var(--red)" onclick="offLive()">DISCONNECT</button></div>`;

}

function goLive(){const i=document.getElementById('tkn');if(!i||!i.value.trim())return;S.token=i.value.trim();S.live=true;S.conf=true;
  fetchExpiries().then(()=>{startEngine().then(()=>{startPolling();refresh()})})}
function offLive(){stopPolling();stopEngine();S.live=false;S.ar=false;clearInterval(arTimer);S.exps=autoExpiries();S.exp=S.exps[0]||'';refresh()}
function tSym(s){if(S.syms.includes(s))S.syms=S.syms.filter(x=>x!==s);else S.syms.push(s);render()}

];let h=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px;margin-bottom:14px">`;

// ═══ SCANNER ════════════════════════════════════════════════════
function renderScanner(){
  let fd=S.data.filter(d=>{if(S.q&&!d.symbol.toLowerCase().includes(S.q.toLowerCase()))return false;
    if(S.flt==='BULLISH')return d.signal==='BULLISH';if(S.flt==='BEARISH')return d.signal==='BEARISH';
    if(S.flt==='ARBITRAGE')return d.signal==='ARBITRAGE'||Math.abs(d.maxPCPPct)>S.vt;return true})
    .sort((a,b)=>{const va=a[S.sk],vb=b[S.sk];return typeof va==='string'?va.localeCompare(vb)*S.sd:((va||0)-(vb||0))*S.sd});
  const cols=[{k:'symbol',l:'Symbol',a:'left'},{k:'spot',l:'Spot ₹'},{k:'iv',l:'IV%'},{k:'pcr',l:'PCR'},
    {k:'totalCallOI',l:'Call OI'},{k:'totalPutOI',l:'Put OI'},{k:'totalCallOIChg',l:'Call Δ'},{k:'totalPutOIChg',l:'Put Δ'},
    {k:'maxPCPPct',l:'Max PCP%'},{k:'violationStrike',l:'@ Strike'},{k:'signal',l:'Signal'}];
  let h=`<div style="overflow-x:auto;animation:fadeUp .3s"><table><thead><tr>`;
  cols.forEach(c=>{const on=S.sk===c.k;h+=`<th class="${on?'sorted':''}" ${c.a?`style="text-align:${c.a}"`:''} onclick="sSort('${c.k}')">${c.l} ${on?(S.sd>0?'↑':'↓'):''}</th>`});
  h+=`</tr></thead><tbody>`;
  fd.forEach((s,i)=>{const ab=Math.abs(s.maxPCPPct)>S.vt;
    h+=`<tr onclick="sSel('${e(s.symbol)}')" style="animation:fadeUp ${.05+i*.012}s;${ab?'background:var(--yel-bg)':''}">
      <td style="text-align:left;font-weight:600;color:var(--t0)"><span style="border-left:3px solid ${sc(s.signal)};padding-left:8px">${e(s.symbol)}</span></td>
      <td style="color:var(--t1)">${fI(s.spot)}</td>
      <td style="color:${s.iv>30?'var(--pur)':'var(--t2)'}">${f(s.iv,1)}</td>
      <td style="color:${s.pcr>1.2?'var(--grn)':s.pcr<.8?'var(--red)':'var(--t2)'};font-weight:${s.pcr>1.3||s.pcr<.7?700:400}">${f(s.pcr)}</td>
      <td style="color:var(--t2)">${fK(s.totalCallOI)}</td><td style="color:var(--t2)">${fK(s.totalPutOI)}</td>
      <td style="color:${s.totalCallOIChg>0?'var(--grn)':'var(--red)'}">${s.totalCallOIChg>0?'+':''}${fK(s.totalCallOIChg)}</td>
      <td style="color:${s.totalPutOIChg>0?'var(--grn)':'var(--red)'}">${s.totalPutOIChg>0?'+':''}${fK(s.totalPutOIChg)}</td>
      <td>${vb(s.maxPCPPct)}</td><td style="color:var(--t2)">₹${s.violationStrike}</td>
      <td><span class="sig sig-${s.signal}">${s.signal}</span></td></tr>`});
  h+=`</tbody></table>`;if(!fd.length)h+=`<div style="text-align:center;padding:40px;color:var(--t2)">No stocks match</div>`;
  h+=`</div>`;return h}

function sSort(k){if(S.sk===k)S.sd*=-1;else{S.sk=k;S.sd=-1}render()}
function sSel(sym){S.sel=S.data.find(d=>d.symbol===sym);S.tab='chain';render()}

// ═══ CHAIN VIEW ═════════════════════════════════════════════════

// Mini charts

  <div style="flex:1;background:rgba(0,230,118,.45);height:${(r.callOI/mxOI)*60}px;border-radius:2px 2px 0 0"></div>
  <div style="flex:1;background:rgba(255,23,68,.45);height:${(r.putOI/mxOI)*60}px;border-radius:2px 2px 0 0"></div></div>`});
h+=`</div><div style="display:flex;gap:14px;margin-top:8px;font-size:10px;color:var(--t2)">

h+=`<div class="card"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-family:var(--mono)">PCP Violation Profile</div>

// ═══ HEATMAP ════════════════════════════════════════════════════

    <td style="color:var(--pur)">${f(r.putIV,1)}%</td>
    <td style="color:var(--t2)">${fK(r.putVol)}</td>
    <td style="color:${r.putOIChg>0?'var(--grn)':r.putOIChg<0?'var(--red)':'var(--t3)'}">${r.putOIChg>0?'+':''}${fK(r.putOIChg)}</td>
    <td style="color:var(--t1)">${fK(r.putOI)}</td></tr>`});
h+=`</tbody></table></div></div>`;return h}

// ═══ FOOTER ═════════════════════════════════════════════════════
function renderFooter(){
  const es=S.engineStats||{};const rl=es.rateLimit||{};const ca=es.cache||{};const pr=es.progress||{};const bk=es.backoffs||{};
  let h=`<div style="margin-top:16px;padding:12px 14px;background:var(--bg-1);border:1px solid var(--border);border-radius:8px;font-size:10px;color:var(--t3);line-height:1.8">
  <strong style="color:var(--t2)">PCP:</strong> C−P = S−K·e⁻ʳᵀ · <strong style="color:var(--t2)">Expiry:</strong> Auto from today (${new Date().toLocaleDateString('en-IN')})`;
  if(S.live){
    h+=`<br><strong style="color:var(--t2)">Engine:</strong>
      <span style="color:var(--blu)">API: ${rl.calls_in_window||0}/${rl.max||50}/min</span> ·
      <span style="color:${(rl.throttled||0)>0?'var(--yel)':'var(--t2)'}">Throttled: ${rl.throttled||0}</span> ·
      <span style="color:var(--grn)">Cache: ${ca.rate||'—'} hit</span> (${ca.valid||0} live) ·
      Scan: <span style="color:var(--blu)">${pr.phase||'idle'}</span> ${pr.done||0}/${pr.total||0}`;
    const bkKeys=Object.keys(bk);
    if(bkKeys.length)h+=`<br><span style="color:var(--red)">⚠ Backoff: ${bkKeys.map(k=>k.split('/').pop()+' ('+bk[k].resume_in+'s)').join(', ')}</span>`;
    h+=`<br><strong style="color:var(--t2)">Flow:</strong> server.py → stagger 5 syms/2s → ≤50 calls/min → 15s sweep → 3s UI poll`;
  }else h+=` · <span>Simulated — paste Upstox token → GO LIVE</span>`;
  h+=`</div>`;return h}

// ═══ INIT ═══════════════════════════════════════════════════════
refresh();
</script>
